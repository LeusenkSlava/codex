[project]
name = "codex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.0",
    "asyncpg==0.30.0",
    "fastapi[standard]==0.141.1",
    "psycopg[binary]==3.2.6",
    "pydantic==2.13.5",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]==2.0.52",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
